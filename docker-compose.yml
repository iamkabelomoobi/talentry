name: talentry

version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: talentry-postgres
    restart: always
    environment:
      POSTGRES_USER: talentry
      POSTGRES_PASSWORD: talentry
      POSTGRES_DB: talentry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: talentry-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mailhog:
    image: mailhog/mailhog
    container_name: talentry-mailhog
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  redis_data: